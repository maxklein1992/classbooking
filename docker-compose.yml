services:
  db:
    image: postgres:16-alpine
    container_name: classbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: classbooking
      POSTGRES_PASSWORD: classbooking
      POSTGRES_DB: classbooking
    ports:
      - "5432:5432"
    volumes:
      - classbooking-db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: classbooking-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://classbooking:classbooking@db:5432/classbooking?schema=public"
      JWT_SECRET: "change-me-in-production"
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  classbooking-db-data:
