services:
  db:
    image: postgres:16-alpine
    container_name: classbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: classbooking
      POSTGRES_PASSWORD: classbooking
      POSTGRES_DB: classbooking
    ports:
      - "5432:5432"
    volumes:
      - classbooking-db-data:/var/lib/postgresql/data

volumes:
  classbooking-db-data:
